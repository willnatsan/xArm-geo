[workspace]
name = "xArm_geo"
channels = ["conda-forge"]
platforms = ["linux-64"]
version = "0.1.0"

[activation.env]
CMAKE_INSTALL_MODE = "SYMLINK"
CMAKE_INSTALL_PREFIX = "$CONDA_PREFIX"
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib"
ASAN_OPTIONS = "symbolize=1:print_stacktrace=1"
ASAN_SYMBOLIZER_PATH = "$CONDA_PREFIX/bin/llvm-symbolizer"

[dependencies]
# --- Build Dependencies ---
cmake = ">=4.2.3,<5"
clangxx = ">=21.1.8,<22"
ninja = ">=1.13.2,<2"
mold = ">=2.40.4,<3"
sccache = ">=0.14.0,<0.15"
pkg-config = ">=0.29.2,<0.30"

# --- Core Dependencies ---
eigen = ">=3.4.0,<4"
yaml-cpp = ">=0.8.0,<0.9"
simde = ">=0.8.2,<0.9"
proxsuite = ">=0.7.2,<0.8"
coal = ">=3.0.2,<4"
tinyxml2 = ">=11.0.0,<12"

# --- Optional / Interfaces ---
mujoco = ">=3.3.7,<4"
glfw = ">=3.4,<4"
libgl-devel = ">=1.7.0,<2"

# --- Python Bindings & Visualisation Tools ---
python = ">=3.13.12,<3.14"
nanobind = ">=2.10.2,<3"
pip = ">=26.0.1,<27"
scipy = ">=1.17.1,<2"
matplotlib = ">=3.10.8,<4"
pandas = ">=3.0.2,<4"
pytest = ">=8.0.0,<9"

[pypi-dependencies]
xacrodoc = ">=1.3.1, <2"
xarm_geo_analysis = { path = "python/xarm_geo_analysis", editable = true }

[tasks]
configure = { cmd = [
  "cmake",
  "-GNinja",
  "-DCMAKE_PREFIX_PATH=$CONDA_PREFIX",
  "-DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX",
  "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
  "-DCMAKE_BUILD_TYPE={{ build_type }}",
  # Use clang as the compiler
  "-DCMAKE_C_COMPILER=clang",
  "-DCMAKE_CXX_COMPILER=clang++",
  # Use mold as the linker
  "-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=mold",
  "-DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=mold",
  "-DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=mold",
  # Use sccache to speed up compilation
  "-DCMAKE_C_COMPILER_LAUNCHER=sccache",
  "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache",
  # Activate color output with Ninja
  "-DCMAKE_COLOR_DIAGNOSTICS=ON",
  # Inject extra flags (like sanitizers) if provided
  "{{ extra_flags }}",
  "-S", ".",
  "-B", "build"
], args = [
  { arg = "build_type", default = "Debug" }, # Defaults to Building in Debug mode
  { arg = "extra_flags", default = "-Wno-dev" }
] }

build = { cmd = [
  "cmake",
  "--build",
  "build"
], depends-on = ["configure"] }

# Release Mode Build
build_release = { depends-on = [
  { task = "configure", args = ["Release"] },
  "build"
] }

clean = "cmake -E rm -rf build"

# Executable Shortcuts
hw = { cmd = "./build/hardware", depends-on = ["build_release"] }
sim = { cmd = "./build/simulation", depends-on = ["build_release"] }

# Analysis & Reporting
analyse = { cmd = "python -m xarm_geo_analysis.cli" }
report  = { cmd = "python -m xarm_geo_analysis.cli report" }
test-analysis = { cmd = "python -m pytest python/xarm_geo_analysis/tests/ -v -p no:launch_testing -p no:launch_ros" }

# --- Comparative Study Experiments ---
# Run all variants of a single experiment (sim only; hardware needs --hw flag).
exp-1a     = { cmd = "./build/exp_1a_step_response --log true",     depends-on = ["build_release"] }
exp-1b     = { cmd = "./build/exp_1b_smooth_trajectory --log true", depends-on = ["build_release"] }
exp-2      = { cmd = "./build/exp_2_disturbance --log true",        depends-on = ["build_release"] }
exp-3a-sim = { cmd = "./build/exp_3a_sim_hw --log true",            depends-on = ["build_release"] }
exp-3b-sim = { cmd = "./build/exp_3b_obstacle --log true",          depends-on = ["build_release"] }

# Hardware variants — pass the robot IP as the first argument, e.g.:
#   pixi run exp-3a-hw 192.168.1.221
exp-3a-hw = { cmd = "./build/exp_3a_sim_hw --hw {{ ip }} --log true", args = [{ arg = "ip" }], depends-on = ["build_release"] }
exp-3b-hw = { cmd = "./build/exp_3b_obstacle --hw {{ ip }} --log true", args = [{ arg = "ip" }], depends-on = ["build_release"] }

# Per-experiment analysis shortcuts.
# Usage:  pixi run report-exp 1a
#         pixi run report-exp 2
report-exp = { cmd = "python -m xarm_geo_analysis.cli report tests/results/exp_{{ id }}/", args = [{ arg = "id" }] }

# Usage:  pixi run plot-exp 1a --save-dir paper/figures/exp_1a/
# Note: overlay compare requires listing individual CSVs; use the bash helper
# below for convenience, or call 'pixi run analyse plot compare <csvs>...' directly.
plot-exp = { cmd = "bash -c 'python -m xarm_geo_analysis.cli plot compare tests/results/exp_{{ id }}/*.csv --save-dir paper/figures/exp_{{ id }}/'", args = [{ arg = "id" }] }

# --- Separate Environment for Code Quality ---
[feature.lint.dependencies]
pre-commit = ">=4.5.1,<5"

[feature.lint.tasks]
lint = "pre-commit run --all-files"
install-hooks = "pre-commit install"

[environments]
# Creates an isolated 'lint' environment
lint = { features = ["lint"], no-default-feature = true }
