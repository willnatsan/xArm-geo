repos:
  # Standard File Cleanups
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace       # Trims invisible trailing spaces
      - id: end-of-file-fixer         # Ensures files end with a single newline
      - id: check-yaml                # Validates YAML syntax
        args: [--allow-multiple-documents]
      - id: check-added-large-files   # Prevents accidental commits of giant files (e.g., big data dumps)

  # Python Formatting & Linting (Ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  # C++ Formatting (Clang-Format)
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]
